<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Hello, World!</h1>

    <section id="intro">
      <img
        src="https://www.astronomy.com/wp-content/uploads/2023/10/the-earth.jpg"
        alt="Earth"
        width="50%"
        height="100%"
      />
    </section>

    <section>
      <input id="content" type="text" />
      <button id="myButton">Click Me</button>
      <p id="message"></p>
    </section>

    <section>
      <button id="myCount">Add One</button>
      <p id="countTotal"></p>
    </section>

    <section>
      <button id="colorChange">Change colour</button>
    </section>

    <script src="script.js"></script>
  </body>

</html>
